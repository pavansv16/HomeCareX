# HomeCareX frontend — nginx config for the Docker image
# Place this file at: frontend/nginx.conf  (inside the HomeCareX repo)
# Served on port 80 inside the container; docker-compose maps it to 3000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls from the React app: /api/v1/... -> backend:5000/api/v1/...
    # (Vite does the same proxy in dev: '/api' -> http://localhost:5000)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (realtime, attached to the same backend HTTP server)
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (SPA): fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
